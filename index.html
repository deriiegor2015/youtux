<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Youtux</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Youtux Logo" class="logo">
    <h1>Youtux — твоя відеоплатформа</h1>
  </header>

  <main>
    <video controls>
      <source src="videos/demo.mp4" type="video/mp4">
      Твій браузер не підтримує відео.
    </video>

    <button id="likeBtn">👍 Лайк</button>
    <p id="likesCount">Лайків: 0</p>
  </main>

  <footer>
    <p>© 2026 Youtux</p>
  </footer>
</body>
</html>
